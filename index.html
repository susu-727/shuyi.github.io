<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>传讯</title>
    <!-- 这里引用你现有的 CSS 文件 -->
    <link rel="stylesheet" href="cssiosduanxin.css">
</head>
<body>
    <div class="header">
        <div class="header-inner">
            <div class="avatar-container">
                <img src="https://i.pravatar.cc/100?img=1" alt="avatar" class="avatar">
            </div>
            <div style="flex:1; text-align:center;">
                <div style="font-weight:600; font-size:17px;">梦角</div>
                <div style="font-size:12px; color:var(--text-secondary);">在线</div>
            </div>
        </div>
    </div>

    <div class="chat-container" style="flex:1; overflow-y:auto; padding:20px 15px; background:var(--primary-bg); display:flex; flex-direction:column; gap:4px;">
        <div class="message-wrapper received">
            <div class="message message-received">💕 你好呀</div>
        </div>
        <div class="message-wrapper sent">
            <div class="message message-sent">你好 😊</div>
        </div>
    </div>

    <div class="input-area-wrapper">
        <div class="input-area">
            <input type="text" class="message-input" placeholder="iMessage" style="flex:1;">
            <button class="input-btn send-btn">↑</button>
        </div>
    </div>
</body>
</html>
